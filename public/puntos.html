<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de puntos críticos — Examen Carnet B</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    #map { height: 42vh; min-height: 260px; width: 100%; }

    .intro { margin-bottom: 16px; }
    h2.zona { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent);
              margin: 26px 0 10px; display: flex; align-items: center; gap: 6px; }
    h2.zona .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .punto-card { margin-bottom: 10px; box-shadow: var(--shadow-card); }
    .punto-card .nombre { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .punto-card .nota { font-size: 13px; line-height: 1.5; color: var(--text-muted); }
    .punto-card .meta { margin-top: 8px; font-size: 11px; color: var(--text-dimmer); display: flex; gap: 10px; flex-wrap: wrap; }
    .punto-card .meta a { color: var(--accent); text-decoration: none; }
    #contador { font-size: 12px; color: var(--text-dimmer); margin-bottom: 10px; }
    #topbar select { background: var(--bg-dark-2); color: var(--text); border: 1px solid var(--border);
                      border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="topbar" class="topbar topbar-row">
    <h1>Catálogo de puntos críticos</h1>
    <select id="filtroZona"><option value="">Todas las zonas</option></select>
    <a href="lista.html" class="topbar-link">← Mis clases</a>
  </div>
  <div id="map"></div>
  <main>
    <p class="intro">
      Los 68 puntos críticos de tu autoescuela, con la nota real del profesor —
      aunque todavía no hayas conducido cerca de ellos. Para repasar antes de ir a una zona,
      no solo después de una clase.
    </p>
    <div id="contador"></div>
    <div id="contenido"></div>
    <div id="vacio" class="empty-state" style="display:none;">No se pudo cargar el catálogo.</div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Mismo tipo de paleta por zona que el resto del proyecto — un color fijo
    // por zona para que el mapa y la lista se lean juntos de un vistazo.
    const ZONA_COLORS = {
      'ZONA 2 - PEDRALBES': '#1f77b4',
      'ZONA 3 - Z. UNIVERSIT.': '#2ca02c',
      'ZONA 4 - POBLE SEC': '#ff7f0e',
      'ZONA 6 - MONTJÜIC': '#9467bd',
      'ZONA 7 - LA MAQUINISTA': '#8c564b',
    };
    const DEFAULT_COLOR = '#777777';
    function colorFor(zona) { return ZONA_COLORS[zona] || DEFAULT_COLOR; }

    let ALL_POINTS = [];
    let map, markersLayer;

    fetch('data/points.json')
      .then(r => r.json())
      .then(pts => {
        ALL_POINTS = pts;
        initMap(pts);
        setupFilter(pts);
        render(pts);
        // Llegada desde el buscador de la home con ?zona=... — preselecciona el
        // filtro en vez de enseñar los 68 puntos sin más contexto. En su propio
        // setTimeout para que se aplique DESPUÉS del fitBounds inicial de
        // initMap (que también se difiere un tick) y no lo pise.
        const zonaUrl = new URLSearchParams(location.search).get('zona');
        const select = document.getElementById('filtroZona');
        if (zonaUrl && Array.from(select.options).some(o => o.value === zonaUrl)) {
          setTimeout(() => {
            select.value = zonaUrl;
            select.dispatchEvent(new Event('change'));
          }, 0);
        }
      })
      .catch(() => { document.getElementById('vacio').style.display = 'block'; });

    function initMap(points) {
      map = L.map('map');
      // Mismo cambio que en mapa.html: MapTiler "streets-v4" en vez de
      // Mapnik crudo, menos ruido de numeración de portal/iconos de comercio.
      const MAPTILER_KEY = '10thvqKVtuWBM8HAADxF';
      L.tileLayer('https://api.maptiler.com/maps/streets-v4/256/{z}/{x}/{y}.png?key=' + MAPTILER_KEY, {
        maxZoom: 19, tileSize: 256, crossOrigin: true,
        attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> &copy; OpenStreetMap contributors',
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      const bounds = points.map(p => [p.lat, p.lng]);
      // invalidateSize + fitBounds en el siguiente tick: si se llama a
      // fitBounds en el mismo ciclo en que se crea el mapa, a veces el
      // contenedor todavía no tiene su tamaño real aplicado y Leaflet
      // calcula un encuadre roto (zoom máximo, área minúscula).
      setTimeout(() => {
        map.invalidateSize();
        if (bounds.length) map.fitBounds(bounds, { padding: [20, 20] });
      }, 0);
    }

    function renderMap(points) {
      markersLayer.clearLayers();
      points.forEach(p => {
        const color = colorFor(p.zona);
        const notaCorta = p.nota && p.nota.length > 260 ? p.nota.slice(0, 260) + '…' : (p.nota || '');
        const popupHtml =
          '<strong>' + p.nombre + '</strong><br>' +
          (notaCorta ? '<div style="max-width:220px;margin-top:4px;">' + notaCorta + '</div>' : '') +
          '<div style="margin-top:6px;font-size:11px;color:#666;">' + p.zona + '</div>' +
          (p.google_maps_link ? '<a href="' + p.google_maps_link + '" target="_blank" rel="noopener">Ver en Maps</a> · ' : '') +
          '<a href="https://www.mapillary.com/app/?lat=' + p.lat + '&lng=' + p.lng + '&z=18" target="_blank" rel="noopener">📷 Fotos</a>';
        L.circleMarker([p.lat, p.lng], {
          radius: 7, color: '#fff', weight: 1.5, fillColor: color, fillOpacity: 0.9,
        }).bindPopup(popupHtml).addTo(markersLayer);
      });
    }

    function setupFilter(points) {
      const zonas = Array.from(new Set(points.map(p => p.zona))).sort();
      const select = document.getElementById('filtroZona');
      zonas.forEach(z => {
        const opt = document.createElement('option');
        opt.value = z;
        opt.textContent = z;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => {
        const filtered = select.value ? ALL_POINTS.filter(p => p.zona === select.value) : ALL_POINTS;
        render(filtered);
        const bounds = filtered.map(p => [p.lat, p.lng]);
        if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
      });
    }

    function render(points) {
      const contenido = document.getElementById('contenido');
      const contador = document.getElementById('contador');
      contenido.innerHTML = '';
      contador.textContent = points.length + ' de ' + ALL_POINTS.length + ' puntos';

      const porZona = {};
      points.forEach(p => { (porZona[p.zona] = porZona[p.zona] || []).push(p); });

      Object.keys(porZona).sort().forEach(zona => {
        const h2 = document.createElement('h2');
        h2.className = 'zona';
        h2.innerHTML = '<span class="swatch" style="background:' + colorFor(zona) + ';"></span>' + zona;
        contenido.appendChild(h2);

        porZona[zona].forEach(p => {
          const card = document.createElement('div');
          card.className = 'card punto-card';
          card.innerHTML =
            '<div class="nombre">' + p.nombre + '</div>' +
            '<div class="nota">' + (p.nota || '') + '</div>' +
            '<div class="meta">' +
            (p.google_maps_link ? '<a href="' + p.google_maps_link + '" target="_blank" rel="noopener">Ver en Maps</a>' : '') +
            '<a href="https://www.mapillary.com/app/?lat=' + p.lat + '&lng=' + p.lng + '&z=18" target="_blank" rel="noopener">📷 Fotos de calle</a>' +
            '<span>' + (p.fuente || '') + '</span>' +
            '</div>';
          contenido.appendChild(card);
        });
      });

      if (map) renderMap(points);
    }
  </script>
</body>
</html>
