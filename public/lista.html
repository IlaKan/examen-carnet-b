<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis clases — Examen Carnet B</title>
  <style>
    :root { --accent: #4285F4; --bg-dark: #16181d; --bg-dark-2: #1f2229; }
    html, body { margin: 0; padding: 0; background: var(--bg-dark); color: #e7e9ee;
                 font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    #topbar {
      background: var(--bg-dark); padding: 16px 16px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
      position: sticky; top: 0; z-index: 5;
    }
    #topbar h1 { font-size: 18px; margin: 0 0 4px; }
    #topbar .subtitle { font-size: 12px; color: #767c88; }

    #navlinks { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; background: var(--bg-dark-2); }
    #navlinks a {
      color: #c7ccd4; text-decoration: none; font-size: 12.5px; background: #2a2e37;
      border: 1px solid #383d48; border-radius: 999px; padding: 7px 12px;
      display: inline-flex; align-items: center; gap: 5px; transition: border-color .15s;
    }
    #navlinks a:hover { border-color: var(--accent); color: #fff; }

    main { max-width: 640px; margin: 0 auto; padding: 16px; }

    #semana { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
              padding-bottom: 4px; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
    #semana::-webkit-scrollbar { display: none; }
    .dia {
      scroll-snap-align: start; flex: 0 0 auto; width: 42px; padding: 8px 0 9px;
      border-radius: 12px; background: var(--bg-dark-2); border: 1.5px solid transparent;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #9aa0ab; font-size: 11px; cursor: default; -webkit-tap-highlight-color: transparent;
    }
    .dia .num { font-size: 15px; font-weight: 700; color: #e7e9ee; }
    .dia.hoy { border-color: var(--accent); }
    .dia.con-clase { cursor: pointer; }
    .dia.con-clase .num { color: var(--accent); }
    .dia .punto { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
    .dia .punto.vacio { background: transparent; }
    .dia.activo { background: var(--accent); border-color: var(--accent); }
    .dia.activo, .dia.activo .num { color: #0a1f18; }
    .dia.activo .punto { background: #0a1f18; }

    #filtros { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    #filtros select {
      background: var(--bg-dark-2); color: #e7e9ee; border: 1px solid #383d48;
      border-radius: 8px; padding: 8px 12px; font-size: 13px; flex: 1 1 auto;
    }

    .card {
      background: var(--bg-dark-2); border-radius: 12px; padding: 16px; margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); text-decoration: none; color: inherit; display: block;
      border: 1px solid transparent; transition: border-color .15s, transform .1s;
    }
    .card:hover { border-color: var(--accent); }
    .card:active { transform: scale(0.99); }
    .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .card .meta { font-size: 12.5px; color: #9aa0ab; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card .zona-tag {
      background: #2a2e37; color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: 11px;
    }

    #vacio { color: #767c88; padding: 50px 20px; text-align: center; font-size: 14px; line-height: 1.6; }
    #vacio .big { font-size: 32px; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>Mis clases</h1>
    <div class="subtitle" id="subtitle">Cargando…</div>
  </div>
  <div id="navlinks">
    <a href="tecnica.html">📋 Checklist de técnica general</a>
    <a href="puntos.html">📍 Catálogo de 68 puntos</a>
  </div>
  <main>
    <div id="semana"></div>
    <div id="filtros" style="display:none;">
      <select id="filtroZona"><option value="">Todas las zonas</option></select>
      <select id="filtroMes" style="display:none;"><option value="">Todas las fechas</option></select>
    </div>
    <div id="lista"></div>
    <div id="vacio" style="display:none;">
      <span class="big">🚗</span>
      Todavía no hay ninguna clase grabada.<br>
      Procesa un GPX con <code>scripts/nueva_clase.py</code> para que aparezca aquí.
    </div>
  </main>

  <script>
    fetch('data/tracks/index.json')
      .then(r => r.json())
      .then(renderAll)
      .catch(() => {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('vacio').style.display = 'block';
      });

    let ALL_TRACKS = [];
    let diaFiltro = '';

    function renderAll(tracks) {
      ALL_TRACKS = tracks;
      if (tracks.length === 0) {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('vacio').style.display = 'block';
        return;
      }

      document.getElementById('subtitle').textContent =
        tracks.length + (tracks.length === 1 ? ' clase grabada' : ' clases grabadas');

      renderSemana(tracks);

      const zonas = new Set();
      const meses = new Set();
      const MESES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                         'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      tracks.forEach(t => {
        (t.zonas || []).forEach(z => zonas.add(z));
        if (t.fecha) meses.add(t.fecha.slice(0, 7)); // "YYYY-MM"
      });

      let anyFilterShown = false;
      if (zonas.size > 1) {
        anyFilterShown = true;
        const select = document.getElementById('filtroZona');
        Array.from(zonas).sort().forEach(z => {
          const opt = document.createElement('option');
          opt.value = z;
          opt.textContent = z;
          select.appendChild(opt);
        });
        select.addEventListener('change', applyFilters);
      }
      if (meses.size > 1) {
        anyFilterShown = true;
        const select = document.getElementById('filtroMes');
        select.style.display = '';
        Array.from(meses).sort().reverse().forEach(m => {
          const [year, month] = m.split('-');
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = MESES_ES[parseInt(month, 10) - 1] + ' ' + year;
          select.appendChild(opt);
        });
        select.addEventListener('change', applyFilters);
      }
      if (anyFilterShown) document.getElementById('filtros').style.display = 'flex';

      renderList(ALL_TRACKS);
    }

    function applyFilters() {
      const zonaFiltro = document.getElementById('filtroZona').value;
      const mesFiltro = document.getElementById('filtroMes').value;
      const filtered = ALL_TRACKS.filter(t =>
        (!zonaFiltro || (t.zonas || []).includes(zonaFiltro)) &&
        (!mesFiltro || (t.fecha || '').slice(0, 7) === mesFiltro) &&
        (!diaFiltro || t.fecha === diaFiltro)
      );
      renderList(filtered);
    }

    // Tira de los últimos 7 días (hoy incluido, no la semana de calendario Lun-Dom) —
    // así siempre se ven las clases más recientes aunque caigan a caballo de dos
    // semanas naturales. Cada día con clase es clicable y filtra la lista a ese día;
    // volver a tocarlo lo quita. Scroll horizontal con snap, como una tira nativa.
    const DIAS_ES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    function renderSemana(tracks) {
      const cont = document.getElementById('semana');
      cont.innerHTML = '';
      const fechasConClase = new Set(tracks.map(t => t.fecha));
      const hoy = new Date();
      const hoyISO = hoy.toISOString().slice(0, 10);

      for (let i = 6; i >= 0; i--) {
        const d = new Date(hoy);
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const tieneClase = fechasConClase.has(iso);

        const el = document.createElement('div');
        el.className = 'dia' + (iso === hoyISO ? ' hoy' : '') + (tieneClase ? ' con-clase' : '')
          + (iso === diaFiltro ? ' activo' : '');
        el.innerHTML =
          '<span>' + DIAS_ES[d.getDay()] + '</span>' +
          '<span class="num">' + d.getDate() + '</span>' +
          '<span class="punto' + (tieneClase ? '' : ' vacio') + '"></span>';
        if (tieneClase) {
          el.addEventListener('click', () => {
            diaFiltro = (diaFiltro === iso) ? '' : iso;
            renderSemana(tracks);
            applyFilters();
          });
        }
        cont.appendChild(el);
      }
    }

    function renderList(filtered) {
      const container = document.getElementById('lista');
      container.innerHTML = '';

      filtered.forEach(t => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = 'mapa.html?track=' + encodeURIComponent(t.id);
        const zonaTags = (t.zonas || []).map(z => '<span class="zona-tag">' + z + '</span>').join('');
        a.innerHTML =
          '<h3>' + t.nombre + '</h3>' +
          '<div class="meta">' +
          '<span>' + t.fecha + '</span>' +
          (t.duracion_min ? '<span>· ' + Math.round(t.duracion_min) + ' min</span>' : '') +
          (zonaTags || '<span class="zona-tag">sin zona</span>') +
          '</div>';
        container.appendChild(a);
      });
    }
  </script>
</body>
</html>
