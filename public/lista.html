<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis clases — Examen Carnet B</title>
  <style>
    :root { --accent: #4285F4; --bg-dark: #16181d; --bg-dark-2: #1f2229; --lila: #8b7cf6; }
    html, body { margin: 0; padding: 0; background: var(--bg-dark); color: #e7e9ee;
                 font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    #topbar {
      background: var(--bg-dark); padding: 16px 16px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.35);
      position: sticky; top: 0; z-index: 5;
    }
    #topbar h1 { font-size: 18px; margin: 0 0 4px; }
    #topbar .subtitle { font-size: 12px; color: #767c88; }

    #navlinks { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; background: var(--bg-dark-2); }
    #navlinks a {
      color: #c7ccd4; text-decoration: none; font-size: 12.5px; background: #2a2e37;
      border: 1px solid #383d48; border-radius: 999px; padding: 7px 12px;
      display: inline-flex; align-items: center; gap: 5px; transition: border-color .15s;
    }
    #navlinks a:hover { border-color: var(--accent); color: #fff; }

    main { max-width: 640px; margin: 0 auto; padding: 16px; }

    #semana { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
              padding-bottom: 4px; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
    #semana::-webkit-scrollbar { display: none; }
    .dia {
      scroll-snap-align: start; flex: 0 0 auto; width: 42px; padding: 8px 0 9px;
      border-radius: 12px; background: var(--bg-dark-2); border: 1.5px solid transparent;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #9aa0ab; font-size: 11px; cursor: default; -webkit-tap-highlight-color: transparent;
    }
    .dia .num { font-size: 15px; font-weight: 700; color: #e7e9ee; }
    .dia.hoy { border-color: var(--accent); }
    .dia.con-clase { cursor: pointer; }
    .dia.con-clase .num { color: var(--accent); }
    .dia .punto { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
    .dia .punto.vacio { background: transparent; }
    .dia.activo { background: var(--accent); border-color: var(--accent); }
    .dia.activo, .dia.activo .num { color: #0a1f18; }
    .dia.activo .punto { background: #0a1f18; }

    #buscador-wrap { margin-bottom: 18px; position: relative; }
    #buscador {
      width: 100%; box-sizing: border-box; background: transparent; border: none;
      border-bottom: 2px solid #2a2e37; color: #e7e9ee; font-size: 19px; font-weight: 400;
      padding: 6px 2px 10px; outline: none; font-family: inherit;
    }
    #buscador::placeholder { color: #4d5560; }
    #buscador:focus { border-bottom-color: var(--accent); }
    #resultados {
      display: none; margin-top: 10px; background: var(--bg-dark-2); border-radius: 12px;
      padding: 14px 16px; max-height: 340px; overflow-y: auto;
    }
    #resultados .grupo-label {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280;
      font-weight: 600; margin: 12px 0 6px;
    }
    #resultados .grupo-label:first-child { margin-top: 0; }
    #resultados a.res, #resultados .res-vacio {
      display: flex; align-items: center; gap: 9px; padding: 6px 0; text-decoration: none;
      color: #e7e9ee; font-size: 13px;
    }
    #resultados a.res:hover { color: var(--accent); }
    #resultados .res-vacio { color: #565c66; font-style: italic; }
    #resultados .res-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    #resultados .res-sub { font-size: 10.5px; color: #767c88; display: block; }

    .cta-ultima {
      display: block; background: var(--lila); color: #17102e; text-decoration: none;
      border-radius: 14px; padding: 18px; margin-bottom: 14px;
    }
    .cta-ultima .label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .75; font-weight: 700; }
    .cta-ultima .titulo { font-size: 17px; font-weight: 800; margin-top: 5px; }
    .cta-ultima .sub { font-size: 12.5px; margin-top: 3px; opacity: .85; }

    .cta-thumb {
      display: block; border-radius: 14px; overflow: hidden; text-decoration: none;
      color: #fff; margin-bottom: 18px; position: relative; height: 130px;
      background-size: cover; background-position: center;
    }
    .cta-thumb::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,15,.15) 0%, rgba(10,10,15,.85) 100%);
    }
    .cta-thumb .contenido { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; }
    .cta-thumb .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; opacity: .8; font-weight: 700; }
    .cta-thumb .titulo { font-size: 15.5px; font-weight: 700; margin-top: 3px; }

    #filtros { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    #filtros select {
      background: var(--bg-dark-2); color: #e7e9ee; border: 1px solid #383d48;
      border-radius: 8px; padding: 8px 12px; font-size: 13px; flex: 1 1 auto;
    }

    .card {
      background: var(--bg-dark-2); border-radius: 12px; padding: 16px; margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); text-decoration: none; color: inherit; display: block;
      border: 1px solid transparent; transition: border-color .15s, transform .1s;
    }
    .card:hover { border-color: var(--accent); }
    .card:active { transform: scale(0.99); }
    .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .card .meta { font-size: 12.5px; color: #9aa0ab; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card .zona-tag {
      background: #2a2e37; color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: 11px;
    }

    #vacio { color: #767c88; padding: 50px 20px; text-align: center; font-size: 14px; line-height: 1.6; }
    #vacio .big { font-size: 32px; display: block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>Mis clases</h1>
    <div class="subtitle" id="subtitle">Cargando…</div>
  </div>
  <main>
    <div id="semana"></div>

    <div id="buscador-wrap">
      <input id="buscador" type="text" placeholder="Busca un punto, una clase, un tip…" autocomplete="off">
      <div id="resultados"></div>
    </div>

    <div id="ctaUltima"></div>

    <a class="cta-thumb" href="tecnica.html"
       style="background-image:url('https://images.unsplash.com/photo-1722500342362-f05c2bf325c1?auto=format&amp;fit=crop&amp;w=900&amp;q=60');">
      <div class="contenido">
        <div class="label">Checklist de técnica</div>
        <div class="titulo">Fallos que se repiten en exámenes reales →</div>
      </div>
    </a>

    <a class="cta-thumb" href="fallos.html"
       style="background-image:url('https://images.unsplash.com/photo-1752199908720-e5aaa67909e7?auto=format&amp;fit=crop&amp;w=900&amp;q=60');">
      <div class="contenido">
        <div class="label">Fallos reales documentados</div>
        <div class="titulo">Casos reales en vídeo, por zona →</div>
      </div>
    </a>

    <div id="filtros" style="display:none;">
      <select id="filtroZona"><option value="">Todas las zonas</option></select>
      <select id="filtroMes" style="display:none;"><option value="">Todas las fechas</option></select>
    </div>
    <div id="lista"></div>
    <div id="vacio" style="display:none;">
      <span class="big">🚗</span>
      Todavía no hay ninguna clase grabada.<br>
      Procesa un GPX con <code>scripts/nueva_clase.py</code> para que aparezca aquí.
    </div>
  </main>

  <script>
    fetch('data/tracks/index.json')
      .then(r => r.json())
      .then(renderAll)
      .catch(() => {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('vacio').style.display = 'block';
      });

    let ALL_TRACKS = [];
    let ALL_POINTS = [];
    let ALL_TIPS = [];
    let ALL_FALLOS = [];
    let diaFiltro = '';

    fetch('data/points.json').then(r => r.json()).then(d => { ALL_POINTS = d; }).catch(() => {});
    fetch('data/tecnica_general.json').then(r => r.json()).then(d => { ALL_TIPS = d; }).catch(() => {});
    fetch('data/fallos_reales.json').then(r => r.json()).then(d => { ALL_FALLOS = d; }).catch(() => {});

    const ZONA_COLORS = {
      'ZONA 2 - PEDRALBES': '#1f77b4', 'ZONA 3 - Z. UNIVERSIT.': '#2ca02c',
      'ZONA 4 - POBLE SEC': '#ff7f0e', 'ZONA 6 - MONTJÜIC': '#9467bd',
      'ZONA 7 - LA MAQUINISTA': '#8c564b',
    };

    function renderCtaUltima(tracks) {
      const cont = document.getElementById('ctaUltima');
      if (!tracks.length) { cont.innerHTML = ''; return; }
      const ultima = tracks[0]; // ya viene ordenado por fecha desc desde track_index.py
      const a = document.createElement('a');
      a.className = 'cta-ultima';
      a.href = 'mapa.html?track=' + encodeURIComponent(ultima.id);
      a.innerHTML =
        '<div class="label">Tu última clase</div>' +
        '<div class="titulo">Repasar ' + ultima.fecha + ' →</div>' +
        '<div class="sub">' + (ultima.zonas || []).join(', ') +
        (ultima.duracion_min ? ' · ' + Math.round(ultima.duracion_min) + ' min' : '') + '</div>';
      cont.innerHTML = '';
      cont.appendChild(a);
    }

    // Buscador transversal: clases + catálogo de puntos + checklist de técnica,
    // agrupado por fuente. Un grupo sin resultados lo dice explícito en vez de
    // ocultarse, para no esconder huecos de dato (mismo criterio que el resto
    // del proyecto).
    const buscadorInput = document.getElementById('buscador');
    const resultadosDiv = document.getElementById('resultados');
    buscadorInput.addEventListener('input', () => buscar(buscadorInput.value));

    function buscar(qRaw) {
      const q = qRaw.trim().toLowerCase();
      if (!q) { resultadosDiv.style.display = 'none'; resultadosDiv.innerHTML = ''; return; }

      const clases = ALL_TRACKS.filter(t =>
        (t.nombre || '').toLowerCase().includes(q) || (t.zonas || []).some(z => z.toLowerCase().includes(q)));
      const puntos = ALL_POINTS.filter(p =>
        (p.nombre || '').toLowerCase().includes(q) || (p.nota || '').toLowerCase().includes(q) ||
        (p.zona || '').toLowerCase().includes(q)).slice(0, 8);
      const tips = ALL_TIPS.filter(t =>
        (t.tip || '').toLowerCase().includes(q) || (t.categoria || '').toLowerCase().includes(q)).slice(0, 8);
      const fallos = ALL_FALLOS.filter(f =>
        (f.afirmacion || '').toLowerCase().includes(q) || (f.zona || '').toLowerCase().includes(q)).slice(0, 8);

      let html = '';
      html += '<div class="grupo-label">Tus clases · ' + clases.length + '</div>';
      html += clases.length
        ? clases.map(t => '<a class="res" href="mapa.html?track=' + encodeURIComponent(t.id) + '">' +
            '<span class="res-dot" style="background:var(--accent);"></span>' +
            '<span>' + t.nombre + '<span class="res-sub">' + t.fecha + '</span></span></a>').join('')
        : '<div class="res-vacio">Ninguna clase coincide.</div>';

      html += '<div class="grupo-label">Puntos críticos · ' + puntos.length + '</div>';
      html += puntos.length
        ? puntos.map(p => '<a class="res" href="puntos.html">' +
            '<span class="res-dot" style="background:' + (ZONA_COLORS[p.zona] || '#777') + ';"></span>' +
            '<span>' + p.nombre + '<span class="res-sub">' + p.zona + '</span></span></a>').join('')
        : '<div class="res-vacio">Ningún punto del catálogo coincide.</div>';

      html += '<div class="grupo-label">Checklist de técnica · ' + tips.length + '</div>';
      html += tips.length
        ? tips.map(t => '<a class="res" href="tecnica.html">' +
            '<span class="res-dot" style="background:var(--lila);"></span>' +
            '<span>' + t.tip.slice(0, 90) + (t.tip.length > 90 ? '…' : '') +
            '<span class="res-sub">' + t.categoria + '</span></span></a>').join('')
        : '<div class="res-vacio">Ningún tip coincide.</div>';

      html += '<div class="grupo-label">Fallos reales documentados · ' + fallos.length + '</div>';
      html += fallos.length
        ? fallos.map(f => '<a class="res" href="fallos.html">' +
            '<span class="res-dot" style="background:#e05c5c;"></span>' +
            '<span>' + f.afirmacion.slice(0, 90) + (f.afirmacion.length > 90 ? '…' : '') +
            '<span class="res-sub">' + f.zona + '</span></span></a>').join('')
        : '<div class="res-vacio">Ningún caso coincide.</div>';

      resultadosDiv.innerHTML = html;
      resultadosDiv.style.display = 'block';
    }

    function renderAll(tracks) {
      ALL_TRACKS = tracks;
      if (tracks.length === 0) {
        document.getElementById('subtitle').textContent = '';
        document.getElementById('vacio').style.display = 'block';
        return;
      }

      document.getElementById('subtitle').textContent =
        tracks.length + (tracks.length === 1 ? ' clase grabada' : ' clases grabadas');

      renderSemana(tracks);
      renderCtaUltima(tracks);

      const zonas = new Set();
      const meses = new Set();
      const MESES_ES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                         'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      tracks.forEach(t => {
        (t.zonas || []).forEach(z => zonas.add(z));
        if (t.fecha) meses.add(t.fecha.slice(0, 7)); // "YYYY-MM"
      });

      let anyFilterShown = false;
      if (zonas.size > 1) {
        anyFilterShown = true;
        const select = document.getElementById('filtroZona');
        Array.from(zonas).sort().forEach(z => {
          const opt = document.createElement('option');
          opt.value = z;
          opt.textContent = z;
          select.appendChild(opt);
        });
        select.addEventListener('change', applyFilters);
      }
      if (meses.size > 1) {
        anyFilterShown = true;
        const select = document.getElementById('filtroMes');
        select.style.display = '';
        Array.from(meses).sort().reverse().forEach(m => {
          const [year, month] = m.split('-');
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = MESES_ES[parseInt(month, 10) - 1] + ' ' + year;
          select.appendChild(opt);
        });
        select.addEventListener('change', applyFilters);
      }
      if (anyFilterShown) document.getElementById('filtros').style.display = 'flex';

      renderList(ALL_TRACKS);
    }

    function applyFilters() {
      const zonaFiltro = document.getElementById('filtroZona').value;
      const mesFiltro = document.getElementById('filtroMes').value;
      const filtered = ALL_TRACKS.filter(t =>
        (!zonaFiltro || (t.zonas || []).includes(zonaFiltro)) &&
        (!mesFiltro || (t.fecha || '').slice(0, 7) === mesFiltro) &&
        (!diaFiltro || t.fecha === diaFiltro)
      );
      renderList(filtered);
    }

    // Tira de los últimos 7 días (hoy incluido, no la semana de calendario Lun-Dom) —
    // así siempre se ven las clases más recientes aunque caigan a caballo de dos
    // semanas naturales. Cada día con clase es clicable y filtra la lista a ese día;
    // volver a tocarlo lo quita. Scroll horizontal con snap, como una tira nativa.
    const DIAS_ES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    function renderSemana(tracks) {
      const cont = document.getElementById('semana');
      cont.innerHTML = '';
      const fechasConClase = new Set(tracks.map(t => t.fecha));
      const hoy = new Date();
      const hoyISO = hoy.toISOString().slice(0, 10);

      for (let i = 6; i >= 0; i--) {
        const d = new Date(hoy);
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const tieneClase = fechasConClase.has(iso);

        const el = document.createElement('div');
        el.className = 'dia' + (iso === hoyISO ? ' hoy' : '') + (tieneClase ? ' con-clase' : '')
          + (iso === diaFiltro ? ' activo' : '');
        el.innerHTML =
          '<span>' + DIAS_ES[d.getDay()] + '</span>' +
          '<span class="num">' + d.getDate() + '</span>' +
          '<span class="punto' + (tieneClase ? '' : ' vacio') + '"></span>';
        if (tieneClase) {
          el.addEventListener('click', () => {
            diaFiltro = (diaFiltro === iso) ? '' : iso;
            renderSemana(tracks);
            applyFilters();
          });
        }
        cont.appendChild(el);
      }
    }

    function renderList(filtered) {
      const container = document.getElementById('lista');
      container.innerHTML = '';

      filtered.forEach(t => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = 'mapa.html?track=' + encodeURIComponent(t.id);
        const zonaTags = (t.zonas || []).map(z => '<span class="zona-tag">' + z + '</span>').join('');
        a.innerHTML =
          '<h3>' + t.nombre + '</h3>' +
          '<div class="meta">' +
          '<span>' + t.fecha + '</span>' +
          (t.duracion_min ? '<span>· ' + Math.round(t.duracion_min) + ' min</span>' : '') +
          (zonaTags || '<span class="zona-tag">sin zona</span>') +
          '</div>';
        container.appendChild(a);
      });
    }
  </script>
</body>
</html>
