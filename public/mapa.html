<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clase — Examen Carnet B</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100vh; height: 100dvh; /* dvh: fixes iOS Safari's shrinking/growing address bar */
      font-family: -apple-system, sans-serif;
      overflow: hidden;
    }
    body { display: flex; flex-direction: column; }
    #topbar { background: #000; color: #fff; padding: 8px 12px; font-size: 13px; display: flex;
              justify-content: space-between; align-items: center; flex: 0 0 auto; }
    #topbar a { color: #9cf; white-space: nowrap; }
    #map { flex: 1 1 auto; width: 100%; min-height: 0; } /* min-height:0 lets flex children shrink in Safari */
    #layers { background: #eee; padding: 6px 10px; font-size: 11px; display: flex; gap: 8px 12px;
              flex-wrap: wrap; flex: 0 0 auto; }
    #layers label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    #layers .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #fff; }
    #controls { flex: 0 0 auto; height: 52px; background: #222; display: flex; align-items: center;
                gap: 8px; padding: 0 10px; padding-bottom: env(safe-area-inset-bottom, 0); }
    #controls button { font-size: 16px; background: #444; color: #fff; border: none; border-radius: 6px;
                        min-width: 36px; height: 36px; cursor: pointer; flex: 0 0 auto; }
    #speedBtn { font-size: 12px; font-weight: bold; width: 40px; }
    #controls input[type=range] { flex: 1 1 auto; min-width: 0; }
    #controls span { color: #fff; font-size: 11px; min-width: 34px; flex: 0 0 auto; }
    #error { padding: 20px; color: #a00; }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="titulo">Cargando...</span>
    <a href="lista.html">← Mis clases</a>
  </div>
  <div id="layers">
    <label><span class="swatch" style="background:#e74c3c;"></span><input type="checkbox" data-layer="semaforos" checked> Semáforos</label>
    <label><span class="swatch" style="background:#c0392b;"></span><input type="checkbox" data-layer="stops" checked> Stops</label>
    <label><span class="swatch" style="background:#f39c12;"></span><input type="checkbox" data-layer="cedas" checked> Cedas</label>
    <label><span class="swatch" style="background:#2980b9;"></span><input type="checkbox" data-layer="pasos_peatones"> Pasos peatones</label>
    <label><span class="swatch" style="background:#27ae60;"></span><input type="checkbox" data-layer="carril_bici"> Carril bici</label>
    <label><span class="swatch" style="background:#8e44ad;"></span><input type="checkbox" data-layer="carril_bus"> Carril bus</label>
    <label><span class="swatch" style="background:#7f8c8d;"></span><input type="checkbox" data-layer="obras"> Obras</label>
    <label><span class="swatch" style="background:#e91e8c;"></span><input type="checkbox" data-layer="notas" checked> Mis notas</label>
  </div>
  <div id="map"></div>
  <div id="controls">
    <button id="playBtn">▶</button>
    <button id="speedBtn">1x</button>
    <input type="range" id="scrubber" min="0" max="100" value="0" />
    <span id="progressLabel">0%</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const LAYER_STYLE = {
      semaforos: { color: '#e74c3c', label: 'Semáforo' },
      stops: { color: '#c0392b', label: 'Stop' },
      cedas: { color: '#f39c12', label: 'Ceda el paso' },
      pasos_peatones: { color: '#2980b9', label: 'Paso de peatones' },
      carril_bici: { color: '#27ae60', label: 'Carril bici' },
      carril_bus: { color: '#8e44ad', label: 'Carril bus' },
      obras: { color: '#7f8c8d', label: 'Obra' },
      notas: { color: '#e91e8c', label: 'Nota tuya' },
    };

    function params() {
      return new URLSearchParams(window.location.search);
    }

    function fetchJsonOrNull(url) {
      return fetch(url).then(r => (r.ok ? r.json() : null)).catch(() => null);
    }

    async function main() {
      const trackId = params().get('track');
      if (!trackId) {
        document.getElementById('map').outerHTML = '<div id="error">Falta ?track=&lt;id&gt; en la URL.</div>';
        return;
      }

      const [track, osm, obras, overrides, points] = await Promise.all([
        fetchJsonOrNull('data/tracks/' + trackId + '.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-osm.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-obras.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-overrides.json'),
        fetchJsonOrNull('data/points.json'),
      ]);

      if (!track) {
        document.getElementById('map').outerHTML = '<div id="error">No se encontró la clase "' + trackId + '".</div>';
        return;
      }

      document.getElementById('titulo').textContent =
        track.nombre + ' — ' + track.fecha + (track.zonas.length ? ' — ' + track.zonas.join(', ') : '');

      const latlngs = track.points.map(p => [p.lat, p.lng]);
      const map = L.map('map');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);
      map.fitBounds(latlngs, { padding: [20, 20] });

      L.polyline(latlngs, { color: '#999', weight: 3, opacity: 0.45 }).addTo(map);

      // Layers hidden by default (denser / less critical) so the map isn't
      // a wall of dots on first load — matches the checkboxes above, which
      // start unchecked for these same keys.
      const HIDDEN_BY_DEFAULT = new Set(['pasos_peatones', 'carril_bici', 'carril_bus', 'obras']);

      const layerGroups = {};
      function addLayerPoints(key, items, colorOverride) {
        const style = LAYER_STYLE[key] || { color: '#333', label: key };
        const group = L.layerGroup();
        items.forEach(it => {
          const label = it.titol && it.titol.trim() ? it.titol : style.label;
          L.circleMarker([it.lat, it.lng], {
            radius: 7, color: '#fff', weight: 1.5,
            fillColor: colorOverride || style.color, fillOpacity: 0.9,
          })
            // bindPopup (tap-to-open), not bindTooltip (hover-only) — hover
            // doesn't exist on a touchscreen, so tooltips never showed on iPhone.
            .bindPopup('<strong>' + style.label + '</strong>' + (label !== style.label ? '<br>' + label : ''))
            .addTo(group);
        });
        if (!HIDDEN_BY_DEFAULT.has(key)) group.addTo(map);
        layerGroups[key] = group;
      }

      if (osm && osm.disponible) {
        addLayerPoints('semaforos', osm.semaforos);
        addLayerPoints('stops', osm.stops);
        addLayerPoints('cedas', osm.cedas);
        addLayerPoints('pasos_peatones', osm.pasos_peatones);
        addLayerPoints('carril_bici', osm.carril_bici);
        addLayerPoints('carril_bus', osm.carril_bus);
      } else if (osm) {
        console.warn('Infraestructura OSM no disponible para esta clase:', osm.error);
      }

      if (obras && obras.disponible) {
        addLayerPoints('obras', obras.obras);
      } else if (obras) {
        console.warn('Datos de obras no disponibles para esta clase:', obras.error);
      }

      if (overrides) {
        addLayerPoints('overrides-added', overrides.added || [], '#000');
      }

      if (track.waypoints_manuales && track.waypoints_manuales.length) {
        addLayerPoints('notas', track.waypoints_manuales.map(w => ({
          lat: w.lat, lng: w.lng, titol: w.name,
        })));
      }

      document.querySelectorAll('#layers input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const group = layerGroups[cb.dataset.layer];
          if (!group) return;
          if (cb.checked) map.addLayer(group);
          else map.removeLayer(group);
        });
      });

      // Reproducción animada
      const N = latlngs.length;
      const walkedLine = L.polyline([latlngs[0]], { color: '#e74c3c', weight: 5, opacity: 0.9 }).addTo(map);
      const carIcon = L.divIcon({
        className: '', html: '<div style="font-size:22px;transform:translate(-50%,-50%);">🚗</div>',
        iconSize: [0, 0],
      });
      const carMarker = L.marker(latlngs[0], { icon: carIcon }).addTo(map);

      let idx = 0, playing = false, timer = null;
      const SPEEDS = [1, 2, 4];
      let speedIdx = 0;
      const scrubber = document.getElementById('scrubber');
      const playBtn = document.getElementById('playBtn');
      const speedBtn = document.getElementById('speedBtn');
      const progressLabel = document.getElementById('progressLabel');

      // Full route plays back in ~90 real seconds at 1x (was ~16s before —
      // too fast to follow, per feedback testing on a real device).
      const BASE_STEPS_PER_TICK = Math.max(1, Math.round(N / 2200));
      const TICK_MS = 40;

      function setIndex(i) {
        idx = Math.max(0, Math.min(N - 1, i));
        carMarker.setLatLng(latlngs[idx]);
        walkedLine.setLatLngs(latlngs.slice(0, idx + 1));
        scrubber.value = Math.round((idx / (N - 1)) * 100);
        progressLabel.textContent = scrubber.value + '%';
      }

      scrubber.addEventListener('input', () => {
        setIndex(Math.round((Number(scrubber.value) / 100) * (N - 1)));
      });

      function tick() {
        if (!playing) return;
        setIndex(idx + BASE_STEPS_PER_TICK * SPEEDS[speedIdx]);
        if (idx >= N - 1) { playing = false; playBtn.textContent = '▶'; return; }
        timer = setTimeout(tick, TICK_MS);
      }

      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? '⏸' : '▶';
        if (playing) { if (idx >= N - 1) setIndex(0); tick(); }
        else clearTimeout(timer);
      });

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        speedBtn.textContent = SPEEDS[speedIdx] + 'x';
      });

      setIndex(0);
    }

    main();
  </script>
</body>
</html>
