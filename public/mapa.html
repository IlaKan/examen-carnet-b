<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clase — Examen Carnet B</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --accent: #4285F4;
      --bg-dark: #16181d;
      --bg-dark-2: #1f2229;
    }
    html, body {
      margin: 0; padding: 0;
      height: 100vh; height: 100dvh; /* dvh: fixes iOS Safari's shrinking/growing address bar */
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      background: var(--bg-dark);
    }
    body { display: flex; flex-direction: column; }

    #topbar {
      background: var(--bg-dark); color: #fff; padding: 10px 14px 12px;
      display: flex; justify-content: space-between; align-items: center;
      flex: 0 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 10;
    }
    #topbar #titulo { font-size: 14px; font-weight: 600; }
    #topbar .sub { font-size: 11px; color: #9aa0ab; font-weight: 400; display: block; }
    #topbar a { color: var(--accent); text-decoration: none; font-size: 13px; white-space: nowrap; }

    #layers {
      background: var(--bg-dark-2); padding: 8px 10px; display: flex; gap: 6px;
      flex-wrap: wrap; flex: 0 0 auto; z-index: 10;
    }
    #layers label {
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
      font-size: 11px; color: #c7ccd4; background: #2a2e37; border: 1px solid #383d48;
      border-radius: 999px; padding: 5px 10px 5px 8px; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    #layers label:has(input:checked) { background: #333a4a; border-color: var(--accent); color: #fff; }
    #layers input[type=checkbox] { display: none; }
    #layers .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    #map { flex: 1 1 auto; width: 100%; min-height: 0; } /* min-height:0 lets flex children shrink in Safari */

    /* Panel de info en vivo: distancia / tiempo / próximo — la sensación de copiloto */
    #liveinfo {
      position: absolute; left: 10px; top: 10px; z-index: 999;
      background: rgba(22,24,29,.92); color: #fff; border-radius: 14px;
      padding: 10px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
      font-size: 12px; display: none; backdrop-filter: blur(4px);
    }
    #liveinfo.visible { display: block; }
    #liveinfo .row { display: flex; gap: 14px; }
    #liveinfo .stat b { display: block; font-size: 15px; font-weight: 700; }
    #liveinfo .stat span { color: #9aa0ab; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    #liveinfo .next { margin-top: 6px; padding-top: 6px; border-top: 1px solid #333a4a;
                       font-size: 12px; color: #ffd166; min-height: 16px; }

    #controls {
      flex: 0 0 auto; background: var(--bg-dark); border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 16px rgba(0,0,0,.35); padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0)); z-index: 10;
    }
    #controls .row { display: flex; align-items: center; gap: 10px; }
    #controls button {
      font-size: 16px; background: var(--accent); color: #fff; border: none;
      border-radius: 50%; width: 42px; height: 42px; cursor: pointer; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    #speedBtn { border-radius: 999px; width: auto; padding: 0 12px; background: #2a2e37; font-size: 12px; font-weight: 700; }
    #controls input[type=range] {
      flex: 1 1 auto; min-width: 0; accent-color: var(--accent);
    }
    #controls .pct { color: #9aa0ab; font-size: 11px; min-width: 32px; text-align: right; flex: 0 0 auto; }

    #error { padding: 20px; color: #ff6b6b; background: #16181d; height: 100%; box-sizing: border-box; }

    /* Flecha de navegación (sustituye al emoji de coche): apunta en la
       dirección real de avance, calculada por rumbo entre puntos del GPX. */
    .nav-arrow-wrap { width: 0; height: 0; }
    .nav-arrow {
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 22px solid var(--accent);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.5));
      transform-origin: 50% 70%;
    }
    .nav-arrow::after {
      content: ''; position: absolute; left: -6px; top: 14px;
      width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: .0;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="titulo">Cargando…</span>
    <a href="lista.html">← Mis clases</a>
  </div>
  <div id="layers">
    <label><span class="swatch" style="background:#e63946;"></span><input type="checkbox" data-layer="semaforos" checked> Semáforos</label>
    <label><span class="swatch" style="background:#1d3557;"></span><input type="checkbox" data-layer="stops" checked> Stops</label>
    <label><span class="swatch" style="background:#f4a300;"></span><input type="checkbox" data-layer="cedas" checked> Cedas</label>
    <label><span class="swatch" style="background:#2980b9;"></span><input type="checkbox" data-layer="pasos_peatones"> Pasos peatones</label>
    <label><span class="swatch" style="background:#2a9d8f;"></span><input type="checkbox" data-layer="carril_bici"> Carril bici</label>
    <label><span class="swatch" style="background:#9b5de5;"></span><input type="checkbox" data-layer="carril_bus"> Carril bus</label>
    <label><span class="swatch" style="background:#6c757d;"></span><input type="checkbox" data-layer="obras"> Obras</label>
    <label><span class="swatch" style="background:#e91e8c;"></span><input type="checkbox" data-layer="notas" checked> Mis notas</label>
    <label><span class="swatch" style="background:#ffc300;"></span><input type="checkbox" data-layer="catalogo" checked> Puntos autoescuela</label>
    <label><span class="swatch" style="background:#ff7b00;"></span><input type="checkbox" data-layer="rotondas" checked> Rotondas</label>
  </div>
  <div style="position:relative; flex:1 1 auto; min-height:0;">
    <div id="map" style="height:100%;"></div>
    <div id="liveinfo">
      <div class="row">
        <div class="stat"><b id="statDist">0,0 km</b><span>Recorrido</span></div>
        <div class="stat"><b id="statTime">0:00</b><span>Tiempo</span></div>
        <div class="stat"><b id="statTotal">0,0 km</b><span>Total</span></div>
      </div>
      <div class="next" id="nextInfo"></div>
    </div>
  </div>
  <div id="controls">
    <div class="row">
      <button id="playBtn">▶</button>
      <button id="speedBtn">1x</button>
      <input type="range" id="scrubber" min="0" max="100" value="0" />
      <span class="pct" id="progressLabel">0%</span>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Colores elegidos para ser distinguibles entre sí a simple vista (no
    // dos tonos de rojo/naranja parecidos, como pasaba antes con
    // semáforos/stops) — cada capa tiene un matiz de color distinto.
    const LAYER_STYLE = {
      semaforos: { color: '#e63946', label: 'Semáforo' },      // rojo
      stops: { color: '#1d3557', label: 'Stop' },              // azul marino, muy distinto del rojo
      cedas: { color: '#f4a300', label: 'Ceda el paso' },      // ámbar
      pasos_peatones: { color: '#2980b9', label: 'Paso de peatones' }, // azul claro
      carril_bici: { color: '#2a9d8f', label: 'Carril bici' }, // verde-azulado
      carril_bus: { color: '#9b5de5', label: 'Carril bus' },   // morado
      obras: { color: '#6c757d', label: 'Obra' },              // gris
      notas: { color: '#e91e8c', label: 'Nota tuya' },         // rosa
      catalogo: { color: '#ffc300', label: 'Punto autoescuela' }, // dorado, se distingue de todo lo demás
      rotondas: { color: '#ff7b00', label: 'Rotonda' },        // naranja fuerte
    };

    // Distancia máxima para considerar que la ruta "pasa por" un punto del
    // catálogo de la autoescuela (misma tolerancia que zone_matcher.py usa
    // para detectar la zona de una clase nueva).
    const CATALOGO_MATCH_RADIUS_M = 60;

    // Las categorías que de verdad importan revisar mientras conduces —
    // el copiloto ("próximo: ...") solo avisa de estas, no de carriles/obras.
    const COPILOT_LAYERS = ['semaforos', 'stops', 'cedas', 'rotondas'];
    const COPILOT_RADIUS_M = 150;

    function params() {
      return new URLSearchParams(window.location.search);
    }

    function fetchJsonOrNull(url) {
      return fetch(url).then(r => (r.ok ? r.json() : null)).catch(() => null);
    }

    function haversineM(a, b) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(b[0] - a[0]);
      const dLng = toRad(b[1] - a[1]);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    // Rumbo inicial (en grados, 0 = norte, sentido horario) de a hacia b.
    function bearingDeg(a, b) {
      const toRad = x => x * Math.PI / 180, toDeg = x => x * 180 / Math.PI;
      const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
      const dLng = toRad(b[1] - a[1]);
      const y = Math.sin(dLng) * Math.cos(lat2);
      const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function formatKm(m) {
      return (m / 1000).toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
    }

    function formatMinSec(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = Math.floor(totalSeconds % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    async function main() {
      const trackId = params().get('track');
      if (!trackId) {
        document.body.innerHTML = '<div id="error">Falta ?track=&lt;id&gt; en la URL.</div>';
        return;
      }

      const [track, osm, obras, overrides, points] = await Promise.all([
        fetchJsonOrNull('data/tracks/' + trackId + '.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-osm.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-obras.json'),
        fetchJsonOrNull('data/tracks/' + trackId + '-overrides.json'),
        fetchJsonOrNull('data/points.json'),
      ]);

      if (!track) {
        document.body.innerHTML = '<div id="error">No se encontró la clase "' + trackId + '".</div>';
        return;
      }

      document.getElementById('titulo').innerHTML =
        track.nombre + '<span class="sub">' + track.fecha +
        (track.zonas.length ? ' · ' + track.zonas.join(', ') : '') + '</span>';

      const latlngs = track.points.map(p => [p.lat, p.lng]);
      const map = L.map('map', { zoomControl: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);
      map.fitBounds(latlngs, { padding: [20, 20] });

      L.polyline(latlngs, { color: '#999', weight: 3, opacity: 0.4 }).addTo(map);

      // Layers hidden by default (denser / less critical) so the map isn't
      // a wall of dots on first load — matches the checkboxes above, which
      // start unchecked for these same keys.
      const HIDDEN_BY_DEFAULT = new Set(['pasos_peatones', 'carril_bici', 'carril_bus', 'obras']);

      // carril_bici/carril_bus/rotondas son tramos, no puntos sueltos — se
      // dibujan como línea sobre la calle real para ver exactamente dónde
      // no hay que meterse, en vez de un punto genérico "por aquí hay uno".
      // Tolera también el formato antiguo (un solo punto) por si hay datos
      // en caché de antes de este cambio, para no romper clases ya procesadas.
      function addLayerShapes(key, items) {
        const style = LAYER_STYLE[key] || { color: '#333', label: key };
        const group = L.layerGroup();
        (items || []).forEach(it => {
          if (it.points && it.points.length) {
            const coords = it.points.map(p => [p.lat, p.lng]);
            L.polyline(coords, { color: style.color, weight: 6, opacity: 0.75 })
              .bindPopup('<strong>' + style.label + '</strong>')
              .addTo(group);
            if (COPILOT_LAYERS.includes(key)) {
              copilotPoints.push({ lat: coords[0][0], lng: coords[0][1], tipo: style.label });
            }
          } else if (typeof it.lat === 'number') {
            L.circleMarker([it.lat, it.lng], {
              radius: 7, color: '#fff', weight: 1.5, fillColor: style.color, fillOpacity: 0.9,
            }).bindPopup('<strong>' + style.label + '</strong>').addTo(group);
            if (COPILOT_LAYERS.includes(key)) {
              copilotPoints.push({ lat: it.lat, lng: it.lng, tipo: style.label });
            }
          }
        });
        if (!HIDDEN_BY_DEFAULT.has(key)) group.addTo(map);
        layerGroups[key] = group;
      }

      const layerGroups = {};
      const copilotPoints = []; // {lat,lng,tipo} para el aviso "próximo: ..."

      function addLayerPoints(key, items, colorOverride) {
        const style = LAYER_STYLE[key] || { color: '#333', label: key };
        const group = L.layerGroup();
        items.forEach(it => {
          const label = it.titol && it.titol.trim() ? it.titol : style.label;
          L.circleMarker([it.lat, it.lng], {
            radius: 7, color: '#fff', weight: 1.5,
            fillColor: colorOverride || style.color, fillOpacity: 0.9,
          })
            // bindPopup (tap-to-open), not bindTooltip (hover-only) — hover
            // doesn't exist on a touchscreen, so tooltips never showed on iPhone.
            .bindPopup('<strong>' + style.label + '</strong>' + (label !== style.label ? '<br>' + label : ''))
            .addTo(group);
          if (COPILOT_LAYERS.includes(key)) {
            copilotPoints.push({ lat: it.lat, lng: it.lng, tipo: style.label });
          }
        });
        if (!HIDDEN_BY_DEFAULT.has(key)) group.addTo(map);
        layerGroups[key] = group;
      }

      // Cruce con los 68 puntos críticos reales de la autoescuela (HoyVoy):
      // a diferencia de las capas de OSM (genéricas), estos ya traen la nota
      // real de un profesor explicando por qué ese punto concreto es
      // difícil — es el contenido más valioso que tenemos, así que se
      // muestra completo en el popup, no recortado a una etiqueta.
      function addCatalogLayer(catalogPoints) {
        if (!catalogPoints || !catalogPoints.length) return;
        const style = LAYER_STYLE.catalogo;
        const group = L.layerGroup();
        let matched = 0;

        catalogPoints.forEach(cp => {
          let closest = Infinity;
          for (const [lat, lng] of latlngs) {
            const d = haversineM([lat, lng], [cp.lat, cp.lng]);
            if (d < closest) closest = d;
            if (closest <= CATALOGO_MATCH_RADIUS_M) break; // ya es match, no hace falta seguir
          }
          if (closest > CATALOGO_MATCH_RADIUS_M) return;
          matched++;

          const notaCorta = cp.nota && cp.nota.length > 320 ? cp.nota.slice(0, 320) + '…' : (cp.nota || '');
          const popupHtml =
            '<strong>' + cp.nombre + '</strong><br>' +
            (notaCorta ? '<div style="max-width:220px;margin-top:4px;">' + notaCorta + '</div>' : '') +
            '<div style="margin-top:6px;font-size:11px;color:#666;">' + (cp.zona || '') + '</div>';

          L.circleMarker([cp.lat, cp.lng], {
            radius: 8, color: '#fff', weight: 2,
            fillColor: style.color, fillOpacity: 0.95,
          }).bindPopup(popupHtml).addTo(group);

          copilotPoints.push({ lat: cp.lat, lng: cp.lng, tipo: cp.nombre });
        });

        group.addTo(map); // esta capa sí empieza visible: es la más valiosa
        layerGroups['catalogo'] = group;
        console.log(matched + ' de ' + catalogPoints.length + ' puntos del catálogo coinciden con esta ruta (<=' + CATALOGO_MATCH_RADIUS_M + 'm)');
      }

      if (osm && osm.disponible) {
        addLayerPoints('semaforos', osm.semaforos);
        addLayerPoints('stops', osm.stops);
        addLayerPoints('cedas', osm.cedas);
        addLayerPoints('pasos_peatones', osm.pasos_peatones);
        addLayerShapes('carril_bici', osm.carril_bici);
        addLayerShapes('carril_bus', osm.carril_bus);
        addLayerShapes('rotondas', osm.rotondas);
      } else if (osm) {
        console.warn('Infraestructura OSM no disponible para esta clase:', osm.error);
      }

      if (obras && obras.disponible) {
        addLayerPoints('obras', obras.obras);
      } else if (obras) {
        console.warn('Datos de obras no disponibles para esta clase:', obras.error);
      }

      if (overrides) {
        addLayerPoints('overrides-added', overrides.added || [], '#000');
      }

      if (track.waypoints_manuales && track.waypoints_manuales.length) {
        addLayerPoints('notas', track.waypoints_manuales.map(w => ({
          lat: w.lat, lng: w.lng, titol: w.name,
        })));
      }

      addCatalogLayer(points);

      document.querySelectorAll('#layers input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const group = layerGroups[cb.dataset.layer];
          if (!group) return;
          if (cb.checked) map.addLayer(group);
          else map.removeLayer(group);
        });
      });

      // El GPS real "tiembla" unos metros incluso parado (ruido de sensor,
      // más notorio al empezar/acabar la clase). A la escala de calle a la
      // que navega la cámara ahora, ese ruido se ve como vibración — antes
      // pasaba desapercibido porque la vista era mucho más amplia. Se usa
      // una posición suavizada (media de los puntos vecinos) para todo lo
      // visual (flecha, cámara, marcador); la ruta de fondo y la distancia
      // siguen calculándose con los puntos reales, sin alterarlos.
      function smoothPath(points, windowRadius) {
        const out = [];
        for (let i = 0; i < points.length; i++) {
          let sumLat = 0, sumLng = 0, count = 0;
          for (let j = Math.max(0, i - windowRadius); j <= Math.min(points.length - 1, i + windowRadius); j++) {
            sumLat += points[j][0]; sumLng += points[j][1]; count++;
          }
          out.push([sumLat / count, sumLng / count]);
        }
        return out;
      }
      const smoothedLatlngs = smoothPath(latlngs, 2);

      // Distancia acumulada precalculada, para no recorrer el array entero
      // en cada frame — es lo que alimenta el "Recorrido" del panel de info.
      const cumDist = [0];
      for (let i = 1; i < latlngs.length; i++) {
        cumDist.push(cumDist[i - 1] + haversineM(latlngs[i - 1], latlngs[i]));
      }
      const totalDist = cumDist[cumDist.length - 1];
      const pointTimes = track.points.map(p => (p.time ? new Date(p.time).getTime() : null));
      const startTime = pointTimes[0];

      // --- Reproducción animada ---
      const N = latlngs.length;
      const walkedLine = L.polyline([latlngs[0]], { color: '#e63946', weight: 5, opacity: 0.9 }).addTo(map);

      const carMarker = L.marker(latlngs[0], {
        icon: L.divIcon({
          className: '',
          html: '<div class="nav-arrow" style="transform:translate(-10px,-16px) rotate(0deg);"></div>',
          iconSize: [0, 0],
        }),
      }).addTo(map);

      let idx = 0, playing = false, timer = null;
      const SPEEDS = [1, 2, 4];
      let speedIdx = 0;
      const NAV_ZOOM = 18;
      const scrubber = document.getElementById('scrubber');
      const playBtn = document.getElementById('playBtn');
      const speedBtn = document.getElementById('speedBtn');
      const progressLabel = document.getElementById('progressLabel');
      const liveinfo = document.getElementById('liveinfo');
      const statDist = document.getElementById('statDist');
      const statTime = document.getElementById('statTime');
      const statTotal = document.getElementById('statTotal');
      const nextInfo = document.getElementById('nextInfo');

      statTotal.textContent = formatKm(totalDist);

      // Full route plays back in ~90 real seconds at 1x (was ~16s before —
      // too fast to follow, per feedback testing on a real device).
      const BASE_STEPS_PER_TICK = Math.max(1, Math.round(N / 2200));
      const TICK_MS = 55; // un pelín más lento que antes (40ms), a petición

      // Por debajo de esto, dos puntos del GPX están tan cerca que la
      // "dirección" entre ellos es solo ruido del GPS, no movimiento real
      // (típicamente al principio/final, con el coche parado arrancando la
      // grabación) — girar la flecha con ese ruido es justo lo que se
      // sentía como "vibración". Si no hay movimiento real, se mantiene el
      // último rumbo válido en vez de recalcular.
      const MIN_MOVEMENT_FOR_BEARING_M = 5;
      let lastBearingDeg = 0;

      function updateBearing(i) {
        const lookAheadIdx = Math.min(i + 3, N - 1);
        if (lookAheadIdx === i) return;
        if (haversineM(smoothedLatlngs[i], smoothedLatlngs[lookAheadIdx]) < MIN_MOVEMENT_FOR_BEARING_M) return;
        lastBearingDeg = bearingDeg(smoothedLatlngs[i], smoothedLatlngs[lookAheadIdx]);
        const el = carMarker.getElement();
        if (el) {
          const arrow = el.querySelector('.nav-arrow');
          if (arrow) arrow.style.transform = 'translate(-10px,-16px) rotate(' + lastBearingDeg + 'deg)';
        }
      }

      function updateCopilot(pos) {
        let nearest = null, nearestDist = Infinity;
        for (const p of copilotPoints) {
          const d = haversineM(pos, [p.lat, p.lng]);
          if (d < nearestDist) { nearestDist = d; nearest = p; }
        }
        if (nearest && nearestDist <= COPILOT_RADIUS_M) {
          nextInfo.textContent = '📍 Cerca: ' + nearest.tipo + ' (' + Math.round(nearestDist) + ' m)';
        } else {
          nextInfo.textContent = '';
        }
      }

      function setIndex(i) {
        idx = Math.max(0, Math.min(N - 1, i));
        const pos = smoothedLatlngs[idx];
        carMarker.setLatLng(pos);
        walkedLine.setLatLngs(smoothedLatlngs.slice(0, idx + 1));
        scrubber.value = Math.round((idx / (N - 1)) * 100);
        progressLabel.textContent = scrubber.value + '%';
        updateBearing(idx);
        updateCopilot(pos);

        statDist.textContent = formatKm(cumDist[idx]);
        if (startTime && pointTimes[idx]) {
          statTime.textContent = formatMinSec((pointTimes[idx] - startTime) / 1000);
        }

        if (playing) {
          // Modo navegación: la cámara sigue de cerca, con zoom de calle.
          // Sin animación en cada frame — con frames tan seguidos (cada
          // 40ms), un salto directo se ve como movimiento fluido; una
          // animación con duración propia en cada frame competía consigo
          // misma (se reiniciaba a medio camino) y eso sí se veía como
          // vibración en toda la pantalla, no solo en el marcador.
          map.panTo(pos, { animate: false });
        } else if (!map.getBounds().pad(-0.15).contains(pos)) {
          // Pausado/arrastrando el slider: solo recentra si te sales de la vista,
          // para no pelearse con un zoom/pan que hayas hecho tú a mano.
          map.panTo(pos, { animate: true, duration: 0.25 });
        }
      }

      scrubber.addEventListener('input', () => {
        setIndex(Math.round((Number(scrubber.value) / 100) * (N - 1)));
      });

      function tick() {
        if (!playing) return;
        setIndex(idx + BASE_STEPS_PER_TICK * SPEEDS[speedIdx]);
        if (idx >= N - 1) { playing = false; playBtn.textContent = '▶'; return; }
        timer = setTimeout(tick, TICK_MS);
      }

      playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? '⏸' : '▶';
        liveinfo.classList.toggle('visible', playing);
        if (playing) {
          if (idx >= N - 1) setIndex(0);
          map.setView(smoothedLatlngs[idx], NAV_ZOOM, { animate: true });
          tick();
        } else {
          clearTimeout(timer);
        }
      });

      speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        speedBtn.textContent = SPEEDS[speedIdx] + 'x';
      });

      setIndex(0);
    }

    main();
  </script>
</body>
</html>
